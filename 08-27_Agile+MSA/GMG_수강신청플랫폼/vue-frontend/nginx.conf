server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # 새 배포 뒤에도 이전 번들 경로를 가리키지 않도록 HTML은 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite 해시 번들은 파일명이 바뀌므로 장기 캐시하고, 없는 파일을 SPA HTML로 돌려주지 않는다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Vue Router history 모드 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 → API Gateway
    location /api {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OAuth/Auth 요청을 같은 출처로 전달해 Vue 로그인 화면을 유지한다.
    location /auth/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://localhost:8080/ /auth/;
        proxy_cookie_path / /;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
