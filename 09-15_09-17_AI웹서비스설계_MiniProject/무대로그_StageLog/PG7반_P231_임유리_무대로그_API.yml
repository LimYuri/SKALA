openapi: 3.0.0
info:
  title: 무대로그(StageLog) API
  version: 1.0.0
  description: SK-STAGELOG 웹 서비스 개발을 위해 작성된 백엔드 API. Security Schemes는 과제 제출 범위에서 제외한다.
servers:
  - url: http://localhost:8080/api
    description: DEV
tags:
  - { name: 인증 }
  - { name: 밴드 }
  - { name: 가능시간 }
  - { name: 일정 }
  - { name: 곡 }
  - { name: 셋리스트 }
  - { name: 큐시트 }
  - { name: 파일 }
  - { name: 공연기록 }
  - { name: 포트폴리오 }


paths:
  /auth/signup:
    post:
      tags: [인증]
      summary: 회원가입
      description: REQ-FUNC-001 / SCR-SIGNUP-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/login:
    post:
      tags: [인증]
      summary: 로그인
      description: REQ-FUNC-001 / SCR-AUTH-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

        '500': { $ref: '#/components/responses/InternalServerError' }
  /bands:
    get:
      tags: [밴드]
      summary: 내 밴드 목록 조회
      description: REQ-FUNC-002 / SCR-AVAIL-001
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Band' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [밴드]
      summary: 밴드 생성
      description: REQ-FUNC-002 / SCR-AVAIL-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Band' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /bands/{bandId}/members:
    get:
      tags: [밴드]
      summary: 밴드 멤버 목록 조회
      description: REQ-FUNC-002 / SCR-AVAIL-001
      parameters:
        - { name: bandId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [밴드]
      summary: 밴드 멤버 추가
      description: REQ-FUNC-002 / SCR-AVAIL-001
      parameters:
        - { name: bandId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                role: { type: string, enum: [리더, 멤버] }
      responses:
        '201': { description: 추가 성공 }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /availability:
    get:
      tags: [가능시간]
      summary: 밴드 가능 시간 조회
      description: REQ-FUNC-003 / SCR-AVAIL-001
      parameters:
        - { name: bandId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Availability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /availability/bulk:
    put:
      tags: [가능시간]
      summary: 내 가능 시간 전체 교체
      description: REQ-FUNC-003 / SCR-AVAIL-001. 기존 값을 모두 삭제하고 요청 값으로 일괄 교체한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bandId, slots]
              properties:
                bandId: { type: string }
                slots:
                  type: array
                  items:
                    type: object
                    properties:
                      weekday: { type: integer, minimum: 0, maximum: 6 }
                      startTime: { type: string }
                      endTime: { type: string }
      responses:
        '200':
          description: 교체 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /schedules/candidates:
    get:
      tags: [일정]
      summary: 공통 가능 일정 후보 조회
      description: REQ-FUNC-004 / SCR-SCHED-001
      parameters:
        - { name: bandId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: 밴드 멤버 전원이 가능한 시간대 후보
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    start_time: { type: string }
                    end_time: { type: string }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /schedules:
    get:
      tags: [일정]
      summary: 밴드 일정 목록 조회
      description: REQ-FUNC-005, REQ-FUNC-009 / SCR-SCHED-001, SCR-PERF-001
      parameters:
        - { name: bandId, in: query, required: true, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [예정, 완료] } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [일정]
      summary: 일정 확정 생성
      description: REQ-FUNC-005 / SCR-SCHED-001
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /schedules/{scheduleId}:
    get:
      tags: [일정]
      summary: 일정 상세 조회
      description: REQ-FUNC-005, REQ-FUNC-006 / SCR-SCHED-001, SCR-SETLIST-001
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [일정]
      summary: 일정 수정
      description: REQ-FUNC-005 / SCR-SCHED-001
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePatchInput' }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [일정]
      summary: 일정 삭제
      description: REQ-FUNC-005 / SCR-SCHED-001
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 삭제 성공 }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /songs:
    get:
      tags: [곡]
      summary: 곡 목록 조회
      description: REQ-FUNC-006 / SCR-SETLIST-001
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Song' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [곡]
      summary: 곡 등록
      description: REQ-FUNC-006 / SCR-SETLIST-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bandId, title, durationSec]
              properties:
                bandId: { type: string }
                title: { type: string }
                durationSec: { type: integer }
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Song' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /schedules/{scheduleId}/setlist:
    get:
      tags: [셋리스트]
      summary: 셋리스트 조회
      description: REQ-FUNC-006 / SCR-SETLIST-001
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SetlistItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [셋리스트]
      summary: 셋리스트 등록·수정
      description: REQ-FUNC-006 / SCR-SETLIST-001
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [songId, orderNum]
                properties:
                  songId: { type: string }
                  orderNum: { type: integer }
      responses:
        '200': { description: 수정 성공 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /schedules/{scheduleId}/cuesheet:
    get:
      tags: [큐시트]
      summary: 큐시트 자동 생성·조회
      description: REQ-FUNC-007 / SCR-SETLIST-001
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 성공. 각 항목의 startOffsetSec는 순서·소요시간으로 계산되어 반환됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuesheet' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [큐시트]
      summary: 진행 항목·순서·시간·메모 저장 및 재계산
      description: REQ-FUNC-007 / SCR-SETLIST-001
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/CuesheetItemInput' }
      responses:
        '200':
          description: 갱신된 큐시트(재계산 완료) 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuesheet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /uploads/media:
    post:
      tags: [파일]
      summary: 공연 미디어 업로드 (사진·영상·음성)
      description: REQ-FUNC-008 / SCR-PERF-002
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media: { type: string, format: binary }
      responses:
        '201':
          description: 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  mediaType: { type: string, enum: [PHOTO, VIDEO, AUDIO] }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /schedules/{scheduleId}/performance-record:
    post:
      tags: [공연기록]
      summary: 공연 완료 처리 및 기록 생성
      description: REQ-FUNC-008 / SCR-PERF-002
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audienceCount: { type: integer }
                strengthsText: { type: string, description: '잘한 점' }
                improvementsText: { type: string, description: '부족했던 점·보완할 점' }
                mediaItems:
                  type: array
                  items:
                    type: object
                    properties:
                      url: { type: string }
                      mediaType: { type: string, enum: [PHOTO, VIDEO, AUDIO] }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [공연기록]
      summary: 공연 기록 조회
      description: REQ-FUNC-008, REQ-FUNC-009 / SCR-PERF-001, SCR-PERF-002
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceRecord' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /portfolio/{shareToken}:
    get:
      tags: [포트폴리오]
      summary: 공개 포트폴리오 조회 (인증 불필요)
      description: REQ-FUNC-010 / SCR-PORTFOLIO-001. 밴드명·공연 정보·셋리스트·성장 기록을 하나로 모아 반환한다.
      parameters:
        - { name: shareToken, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioView' }
        '404': { $ref: '#/components/responses/NotFound' }

        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  responses:
    BadRequest:
      description: 요청 값이 올바르지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    InternalServerError:
      description: 서버 내부 오류. 잠시 후 다시 시도하세요.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }

    Band:
      type: object
      properties:
        id: { type: string }
        name: { type: string }

    Availability:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        bandId: { type: string }
        weekday: { type: integer }
        startTime: { type: string }
        endTime: { type: string }

    Schedule:
      type: object
      properties:
        id: { type: string }
        bandId: { type: string }
        type: { type: string, enum: [합주, 공연] }
        status: { type: string, enum: [예정, 완료] }
        date: { type: string, format: date }
        startTime: { type: string }
        location: { type: string }

    ScheduleInput:
      type: object
      required: [bandId, type, date, startTime]
      properties:
        bandId: { type: string }
        type: { type: string, enum: [합주, 공연] }
        date: { type: string, format: date }
        startTime: { type: string }
        location: { type: string }

    SchedulePatchInput:
      type: object
      description: 변경할 필드만 전달하는 일정 부분 수정 요청
      properties:
        type: { type: string, enum: [합주, 공연] }
        status: { type: string, enum: [예정, 완료] }
        date: { type: string, format: date }
        startTime: { type: string }
        location: { type: string }

    Song:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        durationSec: { type: integer }

    SetlistItem:
      type: object
      properties:
        id: { type: string }
        songId: { type: string }
        title: { type: string }
        durationSec: { type: integer }
        orderNum: { type: integer }

    CuesheetItemInput:
      type: object
      required: [itemType, durationSec, orderNum]
      properties:
        itemType: { type: string, enum: [SONG, MC, SETUP, BREAK] }
        songId: { type: string, description: 'itemType=SONG일 때 사용' }
        title: { type: string }
        durationSec: { type: integer }
        orderNum: { type: integer }
        note: { type: string }

    CuesheetItem:
      type: object
      properties:
        id: { type: string }
        songId: { type: string, nullable: true, description: SONG 항목이 참조하는 곡 ID }
        itemType: { type: string, enum: [SONG, MC, SETUP, BREAK] }
        orderNum: { type: integer }
        title: { type: string }
        songTitle: { type: string }
        durationSec: { type: integer }
        startOffsetSec: { type: integer, description: '자동 계산, 저장하지 않음' }
        note: { type: string }

    Cuesheet:
      type: object
      properties:
        scheduleId: { type: string }
        totalDurationSec: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/CuesheetItem' }

    PerformanceRecord:
      type: object
      properties:
        id: { type: string }
        scheduleId: { type: string }
        audienceCount: { type: integer }
        strengthsText: { type: string, description: '잘한 점' }
        improvementsText: { type: string, description: '부족했던 점·보완할 점' }
        shareToken: { type: string }
        mediaItems:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              mediaType: { type: string, enum: [PHOTO, VIDEO, AUDIO] }

    PortfolioView:
      type: object
      description: 공개 포트폴리오 화면(SCR-PORTFOLIO-001)에 필요한 데이터를 하나로 모은 조회 전용 응답
      properties:
        bandName: { type: string }
        scheduleDate: { type: string, format: date }
        location: { type: string }
        setlist:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              orderNum: { type: integer }
        audienceCount: { type: integer }
        strengthsText: { type: string, description: '잘한 점' }
        improvementsText: { type: string, description: '부족했던 점·보완할 점' }
        mediaItems:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              mediaType: { type: string, enum: [PHOTO, VIDEO, AUDIO] }
